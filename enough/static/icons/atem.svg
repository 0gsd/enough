<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER (Canon round, 0.4.3). Original line art on the house
     72x72 artboard, drawn inside the ~54 art box: three thin stacked
     text lines narrowing through a small chevron into one short bold
     line — an atem, the tightest reduction of a text (many lines, one
     breath). Pure #000 so build_icons.py's black<->white swap produces
     the dark variant. Overwrite this file and re-run
     scripts/build_icons.py to replace it. -->
<svg id="atem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <line x1="11" y1="22" x2="29" y2="22" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="11" y1="36" x2="29" y2="36" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="11" y1="50" x2="24" y2="50" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <polyline points="36,27 44,36 36,45" fill="none" stroke="#000" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="53" y1="36" x2="58" y2="36" stroke="#000" stroke-width="7" stroke-linecap="round"/>
</svg>
