<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER (agent-free round, 0.4.3). Original line art on the house
     72x72 artboard, drawn inside the ~54 art box: three thin stacked
     text lines above one shorter, medium-weight line — the "short"
     density, the mid-point between an atem (many lines, one bold
     breath) and a full page of thin lines. Pure #000 so
     build_icons.py's black<->white swap produces the dark variant.
     Overwrite this file and re-run scripts/build_icons.py to replace it. -->
<svg id="short" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <line x1="11" y1="17" x2="61" y2="17" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="11" y1="28" x2="61" y2="28" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="11" y1="39" x2="61" y2="39" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="11" y1="55" x2="39" y2="55" stroke="#000" stroke-width="5" stroke-linecap="round"/>
</svg>
