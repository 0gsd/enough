<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER (composure round, P3). Original line art on the house
     72x72 artboard: the app frame with the readvisor panel docked down its
     right-hand edge. Pure #000 so build_icons.py's black<->white swap
     produces the dark variant. Overwrite this file and re-run
     scripts/build_icons.py to replace it. -->
<svg id="readvisor-dock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <rect x="9" y="15" width="54" height="42" rx="5" ry="5"
        fill="none" stroke="#000" stroke-width="3"/>
  <rect x="44" y="20" width="14" height="32" rx="2.5" ry="2.5" fill="#000"/>
</svg>
