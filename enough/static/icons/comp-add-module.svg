  <line x1="18" y1="24" x2="40" y2="24" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="34" x2="33" y2="34" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="41" x2="48" y2="61" stroke="#000" stroke-width="4" stroke-linecap="round"/>
