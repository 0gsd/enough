[project]
name = "enough"
version = "0.2.9"
description = "A paradigmless personal computer harness powered by a local LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Graham Smith" }]
keywords = ["llm", "local-llm", "llama.cpp", "agent", "harness", "paradigm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    # transitive pin: CVE-2026-48710 (BadHost) fixed in starlette 1.0.1.
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.30",
    "httpx[socks]>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # offline translation (translator skill): MADLAD-400-3B-MT via ct2.
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.26",
    # opt-in OpenRouter cloud-model fifth slot: api key lives in the OS
    # keyring (Keychain on macOS, Secret Service on Linux, Credential
    # Manager on Windows), never plaintext on disk. broker reads it
    # on-demand and injects it into outbound requests.
    "keyring>=24",
    "libzim>=3.10",
    # document conversion (convert-plan §6): pandoc + typst ship as wheels so
    # every install — DMG included — reads/writes docx/odt/rtf/epub and can
    # export any markdown to PDF, with no Homebrew and no extra step. GPL
    # pandoc is invoked as a separate process (see THIRD_PARTY_LICENSES.md).
    "pypandoc-binary>=1.17",          # ≈26 MB; wheels for all targets
    "typst>=0.15",                    # ≈31 MB; abi3 wheels for all targets
    # pagination (paginate-plan §1): pure-python PDF surgery — imposition for
    # 2-up/booklet, the `enough-source.md` + `enough-paginate.json` attachments
    # every exported PDF carries, and the unpack that reads them back without
    # docling. Base, not an extra: re-importing our own PDF must work on every
    # install.
    "pypdf>=5",
]

[project.optional-dependencies]
# PDF *reading* (plus decks/workbooks): docling + its layout/table models.
# The floor reads >=2.119 rather than the plan's >=2.120 because the
# exclude-newer cooldown below hides releases younger than a week —
# 2.120.x was three days old at lock time and the resolver refused. The
# extras named here exist unchanged in 2.119.
# `docling-ibm-models[opencv-python-headless]` is ours to add, not a
# duplicate: TableFormer's predictor imports `cv2` at module scope, but
# docling-slim's `models-local` asks for docling-ibm-models with *no*
# extras and opencv is optional there — so `do_table_structure=True`
# raises ModuleNotFoundError on the combination the plan locked (Spike A,
# convert-plan §6; the same hole is in `docling-slim[standard]` and in the
# full `docling` distribution, so the plan's fallback would not have fixed
# it). Headless because a conversion worker has no display and the GUI
# build drags in Qt.
pdf = [
    "docling-slim[format-pdf,format-pptx,format-xlsx,convert-core,models-local,feat-ocr-mac]>=2.119; sys_platform == 'darwin'",
    "docling-slim[format-pdf,format-pptx,format-xlsx,convert-core,models-local,feat-ocr-rapidocr-onnx]>=2.119; sys_platform != 'darwin'",
    "docling-ibm-models[opencv-python-headless]>=3.13",
]

[project.scripts]
enough = "enough.__main__:main"

[project.urls]
Repository = "https://github.com/0gsd/enough"

[tool.uv]
# Dependency cooldown (supply-chain hardening). Never resolve to a
# package release younger than this, giving the community time to catch
# a compromised/yanked upload before it can land in our lockfile. Stored
# as an absolute cutoff in uv.lock at lock time, so end-user `uv sync`
# installs the exact versions we vetted — it does NOT re-resolve by date.
# Applies on `uv lock` / `uv add` / `uv lock --upgrade`. In a security
# emergency, override one package with exclude-newer-package, e.g.:
#   exclude-newer-package = { some-pkg = "2026-06-01T00:00:00Z" }
exclude-newer = "1 week"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enough"]

[tool.hatch.build.targets.sdist]
include = ["enough", "README.md", "LICENSE", "pyproject.toml"]
