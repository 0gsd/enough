[project]
name = "enough"
version = "0.0.9"
description = "A paradigmless personal computer harness powered by a local LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Graham Smith" }]
keywords = ["llm", "local-llm", "llama.cpp", "agent", "harness", "paradigm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # offline translation (translator skill): MADLAD-400-3B-MT via ct2.
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.26",
]

[project.scripts]
enough = "enough.__main__:main"

[project.urls]
Repository = "https://github.com/0gsd/enough"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enough"]

[tool.hatch.build.targets.sdist]
include = ["enough", "README.md", "LICENSE", "pyproject.toml"]
